<!DOCTYPE html>
<html lang="pt-br" x-data="{ tab: 'home', dark: true }" :data-theme="dark ? 'dracula' : 'cupcake'">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen font-sans transition-colors duration-300">

    <!-- NAVBAR -->
    <nav class="navbar bg-base-100 shadow-md px-4 sticky top-0 z-50">
        <div class="flex-1"><a class="btn btn-ghost text-xl">DevPortfolio</a></div>
        <div class="flex-none">
            <button @click="tab = 'home'" class="btn btn-sm btn-ghost" :class="{'btn-active': tab=='home'}">Home</button>
            <button @click="tab = 'sobre'" class="btn btn-sm btn-ghost" :class="{'btn-active': tab=='sobre'}">Sobre</button>
            <button @click="tab = 'projetos'" class="btn btn-sm btn-ghost" :class="{'btn-active': tab=='projetos'}">Projetos</button>
            <button @click="tab = 'contato'" class="btn btn-sm btn-ghost" :class="{'btn-active': tab=='contato'}">Contato</button>
            <input type="checkbox" class="toggle ml-4" x-model="dark" />
        </div>
    </nav>

    <main class="container mx-auto p-4">
        <!-- HOME -->
        <div x-show="tab === 'home'" x-transition>
            <div class="hero min-h-[50vh] bg-base-200 rounded-box mt-4">
                <div class="hero-content text-center">
                    <div class="max-w-md">
                        <h1 class="text-5xl font-bold mb-5">Olá, eu sou Dev</h1>
                        <button @click="tab = 'contato'" class="btn btn-primary">Fale Comigo</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- SOBRE (ACCORDION) -->
        <div x-show="tab === 'sobre'" x-transition x-data="{ ativo: 1 }" class="space-y-2 mt-4">
            <div class="collapse collapse-arrow bg-base-200">
                <input type="radio" name="acc" @click="ativo = 1" checked />
                <div class="collapse-title text-xl font-medium">Minha Experiência</div>
                <div class="collapse-content"><p>Desenvolvedor Web Fullstack.</p></div>
            </div>
            <div class="collapse collapse-arrow bg-base-200">
                <input type="radio" name="acc" @click="ativo = 2" />
                <div class="collapse-title text-xl font-medium">Formação</div>
                <div class="collapse-content"><p>IFRN - Informática.</p></div>
            </div>
            <div class="collapse collapse-arrow bg-base-200">
                <input type="radio" name="acc" @click="ativo = 3" />
                <div class="collapse-title text-xl font-medium">FAQ</div>
                <div class="collapse-content">
                  <div x-data="{ ativo: null }">
                    <button @click="ativo = 1">Pergunta 1</button>
                    <div x-show="ativo === 1">Resposta 1</div>
                  </div>
                  <div x-data="{ ativo: null }">
                    <button @click="ativo = 1">Pergunta 2</button>
                    <div x-show="ativo === 1">Resposta 2</div>
                  </div>
                  <div x-data="{ ativo: null }">
                    <button @click="ativo = 1">Pergunta 3</button>
                    <div x-show="ativo === 1">Resposta 3</div>
                  </div>
                </div>
            </div>
        </div>

        <!-- PROJETOS (CARD) -->
        <div x-show="tab === 'projetos'" x-transition>
          <div class="card bg-base-100 shadow-xl" x-data="{ modal: false }">
            <div class="card-body">
              <h2 class="card-title">Projeto X</h2>
              <button @click="modal = true" class="btn btn-primary">Ver</button>
            </div>
                      <!-- O MODAL -->
          <div x-show="modal"
              class="fixed inset-0 bg-black/80 flex justify-center items-center z-50" x-transition.opacity>
                
              <div @click.outside="modal = false" class="bg-base-100 p-8 rounded-lg">
                  <h3>Detalhes...</h3>
                  <button @click="modal = false" class="btn">X</button>
                </div>
          </div>
          </div>

        </div>

        <!-- CONTATO (FORM) -->
        <div x-show="tab === 'contato'" x-transition 
             x-data="{ email: '', msg: '', enviado: false }" class="max-w-md mx-auto mt-8 bg-base-200 p-6 rounded-xl">
            
            <div class="form-control">
                <label class="label">Email</label>
                <input x-model="email" class="input input-bordered">
            </div>
            
            <div class="form-control mt-4">
                <label class="label">Mensagem</label>
                <textarea x-model="msg" class="textarea textarea-bordered"></textarea>
            </div>

            <div class="mt-6">
                <button @click="enviado = true; email=''; msg=''" 
                        :disabled="!email.includes('@') || msg.length < 5"
                        class="btn btn-primary w-full">Enviar</button>
            </div>

            <div x-show="enviado" x-transition class="alert alert-success mt-4 shadow-lg">
                <span>Mensagem enviada com sucesso!</span>
            </div>
        </div>

    </main>
</body>
</html>
