<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4.17 - Lista 1</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div x-data="{ aberto: false }">
        <button @click="aberto = true">Abrir Modal</button>

        <div x-show="aberto" class="fixed inset-0 flex items-center justify-center bg-neutral-900 bg-opacity-60 text-center">
            <div class="bg-white p-4 rounded shadow-lg">
            <p>Blablabla</p><br>
            <button @click="aberto = false">Fechar</button>
            </div>
        </div>
    </div>
</body>
</html>
