<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2.08 - Lista 1</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="{ contagem: 0 }">
        <button @click="contagem--">-</button>        
        <span x-text="contagem"></span>
        <button @click="contagem++">+</button><br><br>
        <button @click="contagem = 0">Reset</button>       
    </div>
</body>
</html>
