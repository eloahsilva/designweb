<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 5 - Calculadora Freelancer</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div x-data="{servicos: [], novoservico: {nome: '', valor: 0}, total() {return this.servicos.reduce((sum, item) => sum + item.valor, 0);}}">
        <div>
            <div>
                <h1>$ Orçamento #001</h1>
            </div>

            <div>
                <input type="text" x-model="novoservico.nome">
                <input type="number" x-model.number="novoservico.valor">
                <button @click="if (novoservico.nome && novoservico.valor) {servicos.push({...novoservico}); novoservico.nome = ''; novoservico.valor = 0;}">Adicionar</button>
            </div>
            
            <ul>
                <template x-for="(item, index) in servicos" :key="index">
                    <li>
                        <span x-text="item.nome + '  '"></span>
                        <span x-text="'R$ ' + item.valor"></span>
                    </li>
                </template>
            </ul>
        </div>
        
        <div>
            <div>
                <span>TOTAL  </span>
                <span x-text="'R$ ' + total()"></span>
            </div>
        </div>
    </div>
</body>
</html>
